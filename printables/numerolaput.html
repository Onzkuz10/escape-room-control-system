<!doctype html><html lang="fi"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOCK — Tulostettavat numerolaput 0–9</title><style>
@font-face{font-family:DigitSans;src:url('./DigitSans.ttf')}*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:30px;color:#111;background:#eee}header{max-width:860px;margin:auto auto 30px}h1{font-size:25px}p{line-height:1.7;font-size:14px}button{background:#163d25;color:white;padding:12px 20px;border:0;border-radius:5px;font:inherit;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(2,70mm);gap:12mm;justify-content:center}.card{background:#fff;width:70mm;height:90mm;display:grid;place-items:center;break-inside:avoid;position:relative;border:1px dashed #aaa;font-family:DigitSans,sans-serif;font-size:150pt;font-weight:400;line-height:1}.card small{position:absolute;bottom:3mm;right:3mm;font-family:system-ui;font-size:6pt;color:#aaa}@page{size:A4;margin:14mm}@media print{body{margin:0;background:white}header{display:none}.cards{gap:8mm}.card{border:1px dashed #ccc}.card small{display:none}}
</style><header><h1>Tulostettavat numerolaput</h1><p>Tulosta mustavalkoisena, 100 % koossa. Leikkaa laput ja aseta neljä valittua numeroa vaakasuoraan valkoiselle alustalle. Rajaa kameran jokaiselle alueelle yksi kokonainen numero ja valkoista marginaalia. Pidä katkoviiva rajauksen ulkopuolella. Älä käytä peilausta.</p><button onclick="window.print()">Tulosta 0–9</button></header><main class="cards"></main><script>document.querySelector('.cards').innerHTML=Array.from({length:10},(_,i)=>`<div class="card">${i}<small>LOCK / 0${i}</small></div>`).join('');document.fonts.ready.then(()=>document.body.dataset.fontReady='true');</script></html>
